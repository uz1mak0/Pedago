<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <!-- Background with squircle safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Subtle Filipino Sun Motif (8 rays) -->
  <g transform="translate(256, 210)">
    <!-- 8 Sun Rays -->
    <path d="M 0 -130 L 14 -80 L -14 -80 Z" fill="url(#gold)" />
    <path d="M 0 130 L 14 80 L -14 80 Z" fill="url(#gold)" />
    <path d="M 130 0 L 80 14 L 80 -14 Z" fill="url(#gold)" />
    <path d="M -130 0 L -80 14 L -80 -14 Z" fill="url(#gold)" />
    <path d="M 92 92 L 68 44 L 44 68 Z" fill="url(#gold)" opacity="0.9" />
    <path d="M -92 -92 L -68 -44 L -44 -68 Z" fill="url(#gold)" opacity="0.9" />
    <path d="M 92 -92 L 44 -68 L 68 -44 Z" fill="url(#gold)" opacity="0.9" />
    <path d="M -92 92 L -44 68 L -68 44 Z" fill="url(#gold)" opacity="0.9" />
    
    <!-- Central Golden Sun Disc -->
    <circle r="46" fill="url(#gold)" />
    <circle r="36" fill="#0F172A" opacity="0.15" />
    <circle r="22" fill="url(#gold)" />
  </g>
  
  <!-- Speech Bubble & Typography -->
  <path d="M 170 340 C 170 310, 342 310, 342 340 C 342 380, 290 395, 256 395 C 240 405, 216 418, 196 426 C 202 410, 201 400, 196 395 C 178 385, 170 365, 170 340 Z" fill="#FFFFFF" opacity="0.95" />
  <text x="256" y="362" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="28" fill="#0369A1" text-anchor="middle">PEDAGO</text>
</svg>
